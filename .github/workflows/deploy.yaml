name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["feature/v2-integration"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm exec vite build --debug
        working-directory: ./artifacts/examforge
        env:
          BASE_PATH: /Examhome/

      - name: Check build output
        run: |
          echo "=== CWD ==="
          pwd
          echo "=== artifacts/examforge/dist contents ==="
          ls -la artifacts/examforge/dist/ 2>/dev/null || echo "artifacts/examforge/dist/ NOT FOUND"
          echo "=== ./dist contents ==="
          ls -la dist/ 2>/dev/null || echo "./dist/ NOT FOUND"
          echo "=== find all dist directories ==="
          find . -type d -name "dist" -not -path "*/node_modules/*" 2>/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points to the exact folder where your Vite config sends the build
          path: './artifacts/examforge/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
